name: mpc_admin_app
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.1+9

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  coolicons: ^1.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.8.0+1
  url_launcher: ^6.3.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  get_it: ^8.2.0
  flutter_screenutil: ^5.9.3
  rxdart: ^0.28.0
  socket_io_client: ^3.1.2
  image_picker: ^1.2.0
  gap: ^3.0.1
  flutter_svg: ^2.2.1
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  mime: ^2.0.0
  http_parser: ^4.1.2
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - 'assets/logo.png'
    - 'assets/'
    - 'assets/photo-filled.svg'
    - 'assets/camera-plus.svg'
    - 'assets/squat.png'

  fonts:
    - family: 'GoodTimes'
      fonts:
        - asset: 'assets/fonts/GoodTimes.otf'
    - family: 'SF-Pro'
      fonts:
        - asset: 'assets/fonts/SF_pro/SF-Pro-Display-Regular.otf'
          weight: 400
        - asset: 'assets/fonts/SF_pro/SF-Pro-Display-Medium.otf'
          weight: 500
        - asset: 'assets/fonts/SF_pro/SF-Pro-Display-Semibold.otf'
          weight: 600
        - asset: 'assets/fonts/SF_pro/SF-Pro-Display-Bold.otf'
          weight: 700
