name: mpc_mobile_app
description: 'A new Flutter project.'

publish_to: 'none'
version: 1.2.0+21

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  coolicons: ^1.0.0
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  dotted_border: ^3.1.0
  flutter_layout_grid: ^2.0.8
  video_thumbnail: ^0.5.6
  video_player: ^2.10.0
  go_router: ^16.2.4
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  get_it: ^8.2.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.1.2
  rxdart: ^0.28.0
  timezone: ^0.10.1
  intl: ^0.20.2
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  app_links: ^6.4.1
  url_launcher: ^6.3.2
  in_app_purchase: ^3.2.3
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app-icon.png
    - assets/splash-icon.png
    - assets/images/login_header.png
    - assets/images/logo.png
    - assets/images/loading.gif
    - assets/images/training_plan.png
    - assets/images/tutorial.png
    - assets/images/default_avatar.png
    - assets/images/home.svg
    - assets/images/barbell.svg
    - assets/images/movie.svg
    - assets/images/soup.svg
    - assets/images/checklist.svg
    - assets/images/fire.svg

    - assets/images/photo.svg
    - assets/images/dumbbell.svg
    - assets/images/exercise.svg
    - assets/images/camera-plus.svg
    - assets/images/photo-filled.svg
    - assets/images/file-filled.svg
    - assets/images/thumbnail.png
    - assets/images/upper_body.png
    - assets/images/lower_body.png
    - assets/images/all.png
    - assets/images/avatar.png
    - assets/images/arms.png
    # - assets/images/back.png
    # - assets/images/chest.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/app-icon.png'
  adaptive_icon_background: '#0A0D14' # Background color for Android adaptive icon

flutter_native_splash:
  color: '#0A0D14'
  image: assets/splash-icon.png
  android_12:
    image: assets/splash-icon.png
    color: '#0A0D14'
